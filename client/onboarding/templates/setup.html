<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARS Festival — Device Setup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0a0a0f; color: #e0e0e8;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #141420; border: 1px solid #2a2a3e; border-radius: 16px;
    padding: 32px; width: 100%; max-width: 400px;
  }
  h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #8888a0; font-size: 13px; margin-bottom: 24px; }
  .device-id { text-align: center; color: #6c5ce7; font-size: 11px; font-family: monospace; margin-bottom: 20px; }
  
  label { display: block; font-size: 13px; color: #8888a0; margin-bottom: 4px; margin-top: 16px; }
  input, select {
    width: 100%; padding: 12px 14px; border: 1px solid #2a2a3e; border-radius: 8px;
    background: #0a0a0f; color: #e0e0e8; font-size: 16px; outline: none;
    -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: #6c5ce7; }
  
  .ssid-list { margin-top: 8px; max-height: 150px; overflow-y: auto; }
  .ssid-item {
    padding: 10px 14px; border: 1px solid #2a2a3e; border-radius: 6px;
    margin-bottom: 4px; cursor: pointer; font-size: 14px;
    transition: background 0.15s;
  }
  .ssid-item:hover, .ssid-item.selected { background: #6c5ce722; border-color: #6c5ce7; }
  
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    background: #6c5ce7; color: white; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 24px;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .scan-btn {
    background: transparent; border: 1px solid #2a2a3e; color: #8888a0;
    padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    margin-top: 8px;
  }
  
  .error { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 12px; }
  .spinner { display: none; text-align: center; margin-top: 16px; color: #a29bfe; }
  
  .manual-toggle {
    text-align: center; margin-top: 12px; font-size: 12px; color: #6c5ce7;
    cursor: pointer; text-decoration: underline;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🎬 Ars Festival</h1>
  <div class="subtitle">Device Wi-Fi Setup</div>
  <div class="device-id">{{ device_id }}</div>

  <form id="setupForm" action="/connect" method="POST">
    <label>Venue / Location</label>
    <input type="text" name="label" placeholder="e.g., Mariendom-05" required>

    <label>Wi-Fi Network</label>
    <div id="ssidSection">
      <div class="ssid-list" id="ssidList">
        {% for ssid in networks %}
        <div class="ssid-item" onclick="selectSSID(this, '{{ ssid }}')">{{ ssid }}</div>
        {% endfor %}
      </div>
      <button type="button" class="scan-btn" onclick="rescan()">↻ Rescan networks</button>
      <div class="manual-toggle" onclick="showManual()">Enter SSID manually</div>
      <input type="hidden" name="ssid" id="ssidInput" required>
    </div>
    <div id="manualSection" style="display:none">
      <input type="text" name="ssid_manual" id="ssidManual" placeholder="Network name (SSID)">
      <div class="manual-toggle" onclick="showList()">Show available networks</div>
    </div>

    <label>Wi-Fi Password</label>
    <input type="password" name="password" placeholder="Enter password" required>

    <button type="submit" class="btn" id="connectBtn">Connect</button>
  </form>

  <div class="spinner" id="spinner">Connecting… please wait</div>
  <div class="error" id="error"></div>
</div>

<script>
function selectSSID(el, ssid) {
  document.querySelectorAll('.ssid-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('ssidInput').value = ssid;
}

function showManual() {
  document.getElementById('ssidSection').style.display = 'none';
  document.getElementById('manualSection').style.display = 'block';
}
function showList() {
  document.getElementById('ssidSection').style.display = 'block';
  document.getElementById('manualSection').style.display = 'none';
}

function rescan() {
  window.location.href = '/scan';
}

document.getElementById('setupForm').addEventListener('submit', function(e) {
  // Use manual SSID if visible
  const manual = document.getElementById('manualSection');
  if (manual.style.display !== 'none') {
    document.getElementById('ssidInput').value = document.getElementById('ssidManual').value;
  }
  
  if (!document.getElementById('ssidInput').value) {
    e.preventDefault();
    document.getElementById('error').textContent = 'Please select or enter a Wi-Fi network';
    return;
  }
  
  document.getElementById('connectBtn').disabled = true;
  document.getElementById('spinner').style.display = 'block';
});
</script>
</body>
</html>
