<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ars Fleet — Dashboard</title>
<style>
  :root {
    --bg:#0b0b12; --card:#15151f; --card2:#1b1b28; --line:#272736; --ink:#e8e8f0;
    --dim:#8f8fa8; --accent:#7c6cf0; --accent-soft:rgba(124,108,240,.15);
    --ok:#3ddc84; --warn:#ffb020; --bad:#ff6b6b; --pin:#b28dff;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,system-ui,"Segoe UI",sans-serif; background:var(--bg);
         color:var(--ink); min-height:100vh; }
  button { font-family:inherit; }
  input, select { font-family:inherit; }

  /* ── Login ── */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card { background:var(--card); border:1px solid var(--line); border-radius:16px;
                padding:34px; width:100%; max-width:380px; text-align:center; }
  .login-card h1 { font-size:22px; margin:10px 0 4px; }
  .login-card .sub { color:var(--dim); font-size:13px; margin-bottom:26px; }
  .login-card input { width:100%; padding:14px; border:1px solid var(--line); border-radius:10px;
                      background:#10101a; color:var(--ink); font-size:16px; outline:none; margin-bottom:12px; }
  .login-card input:focus { border-color:var(--accent); }
  .login-card .btn-primary { width:100%; margin-top:8px; }
  .login-err { color:var(--bad); font-size:13px; margin-bottom:10px; min-height:16px; }

  /* ── App shell ── */
  #app { display:none; max-width:1280px; margin:0 auto; padding:0 16px calc(90px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:18px 0 12px; }
  header h1 { font-size:19px; font-weight:700; margin-right:auto; }
  header h1 .v { color:var(--dim); font-size:11px; font-weight:400; margin-left:6px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600;
          border:1px solid var(--line); background:var(--card); color:var(--dim); }
  .chip b { color:var(--ink); }
  .chip.c-on b { color:var(--ok); } .chip.c-off b { color:var(--bad); } .chip.c-pin b { color:var(--pin); }

  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:6px 0 14px; }
  .tabs { display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .tabs button { padding:10px 22px; border:none; background:none; color:var(--dim);
                 font-size:14px; font-weight:600; cursor:pointer; }
  .tabs button.active { background:var(--accent); color:#fff; }
  select.groupsel { padding:10px 12px; border:1px solid var(--line); border-radius:10px;
                    background:var(--card); color:var(--ink); font-size:14px; outline:none; }
  .spacer { flex:1; }
  .icon-btn { padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card);
              color:var(--dim); font-size:13px; cursor:pointer; }
  .icon-btn:hover { color:var(--ink); border-color:var(--accent); }

  /* ── Device grid ── */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
  .dev { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;
         cursor:pointer; transition:border-color .15s; }
  .dev:hover { border-color:var(--accent); }
  .dev-head { display:flex; align-items:center; gap:10px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px rgba(61,220,132,.6); }
  .dot.off { background:var(--bad); }
  .dev-name { font-weight:700; font-size:15px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; flex:0 0 auto; }
  .badge.pin { background:rgba(178,141,255,.15); color:var(--pin); border:1px solid rgba(178,141,255,.4); }
  .badge.state-PLAYING_CONNECTED { background:rgba(61,220,132,.12); color:var(--ok); }
  .badge.state-PLAYING_OFFLINE { background:rgba(255,176,32,.12); color:var(--warn); }
  .badge.state-NO_MEDIA { background:#22222e; color:var(--dim); }
  .dev-sub { color:var(--dim); font-size:12px; margin:7px 0 10px; font-family:ui-monospace,monospace;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dev-meta { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim); }
  .dev-meta span b { color:var(--ink); font-weight:600; }
  .empty-hint { grid-column:1/-1; text-align:center; color:var(--dim); padding:60px 20px; line-height:1.7; }

  /* ── Media view ── */
  .dropzone { border:2px dashed var(--line); border-radius:14px; padding:34px 20px; text-align:center;
              color:var(--dim); font-size:14px; margin-bottom:16px; cursor:pointer; transition:.15s; }
  .dropzone.drag { border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }
  .upload-row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
                border-radius:10px; padding:10px 14px; margin:6px 0; font-size:13px; }
  .upload-row .bar { flex:1; height:6px; background:#23232f; border-radius:3px; overflow:hidden; }
  .upload-row .bar i { display:block; height:100%; background:var(--accent); width:0%; transition:width .2s; }
  .media-table { width:100%; border-collapse:collapse; }
  .media-table th { text-align:left; font-size:11px; color:var(--dim); text-transform:uppercase;
                    letter-spacing:.5px; padding:10px 8px; border-bottom:1px solid var(--line); }
  .media-table td { padding:12px 8px; border-bottom:1px solid #1d1d2a; font-size:14px; }
  .media-table tr:hover td { background:#17171f; }
  .media-name { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link-btn { background:none; border:none; color:var(--accent); cursor:pointer; font-size:13px; padding:4px 8px; }
  .link-btn.danger { color:var(--bad); }

  /* ── Buttons ── */
  .btn-primary { padding:13px 20px; border:none; border-radius:10px; background:var(--accent);
                 color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-primary:disabled { opacity:.45; }
  .btn-ghost { padding:12px 18px; border:1px solid var(--line); border-radius:10px; background:var(--card2);
               color:var(--ink); font-size:14px; cursor:pointer; }
  .btn-ghost.danger { color:var(--bad); border-color:rgba(255,107,107,.35); }

  /* ── Drawer / modal ── */
  .overlay { position:fixed; inset:0; background:rgba(5,5,10,.7); z-index:50; display:none; }
  .overlay.open { display:block; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(480px, 100vw); background:var(--bg);
            border-left:1px solid var(--line); z-index:60; transform:translateX(105%);
            transition:transform .22s ease; overflow-y:auto; padding:20px 20px calc(40px + env(safe-area-inset-bottom)); }
  .drawer.open { transform:translateX(0); }
  .drawer h2 { font-size:18px; display:flex; align-items:center; gap:10px; }
  .drawer .close { margin-left:auto; background:none; border:none; color:var(--dim); font-size:26px; cursor:pointer; }
  .section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  .section h3 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.7px; margin-bottom:12px; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:13px; }
  .kv .k { color:var(--dim); } .kv .v { word-break:break-all; }
  .seg { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .seg button { padding:12px 0; border:1px solid var(--line); border-radius:10px; background:var(--card2);
                color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; }
  .seg button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stepper { display:flex; align-items:center; gap:8px; }
  .stepper button { width:48px; height:46px; border:1px solid var(--line); border-radius:10px;
                    background:var(--card2); color:var(--ink); font-size:19px; cursor:pointer; flex:0 0 auto; }
  .stepper .val { flex:1; text-align:center; font-size:24px; font-weight:700; color:var(--accent); }
  .stepper .val small { font-size:12px; color:var(--dim); font-weight:400; }
  .row-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .row-btns .btn-ghost { text-align:center; }
  .field-inline { display:flex; gap:8px; margin-bottom:8px; }
  .field-inline input { flex:1; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
                        background:#10101a; color:var(--ink); font-size:14px; outline:none; min-width:0; }
  .assigned-item { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #1d1d2a; font-size:13px; }
  .assigned-item:last-child { border-bottom:none; }
  .assigned-item .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .settings-note { font-size:11px; color:var(--dim); margin-top:10px; line-height:1.5; }

  /* ── Assign modal ── */
  .modal { position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
           padding:16px; background:rgba(5,5,10,.7); }
  .modal.open { display:flex; }
  .modal-card { background:var(--card); border:1px solid var(--line); border-radius:16px; width:100%;
                max-width:440px; max-height:82vh; display:flex; flex-direction:column; }
  .modal-card h2 { font-size:16px; padding:18px 20px 8px; }
  .modal-body { overflow-y:auto; padding:6px 20px; flex:1; }
  .modal-foot { padding:14px 20px 18px; display:flex; gap:10px; }
  .modal-foot .btn-primary { flex:1; }
  .pick { display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid #1d1d2a;
          cursor:pointer; font-size:14px; }
  .pick input { width:20px; height:20px; accent-color:var(--accent); }
  .pick .g { color:var(--dim); font-size:11px; margin-left:auto; }
  .pick-group { font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:.6px;
                padding:12px 4px 4px; display:flex; align-items:center; gap:8px; cursor:pointer; }

  .toast-wrap { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%;
                transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; }
  .toast { padding:11px 22px; background:#1e1e2c; border:1px solid var(--accent); border-radius:10px;
           font-size:13px; text-align:center; max-width:88vw; }
  .toast.err { border-color:var(--bad); }

  @media (max-width: 560px) {
    header h1 { width:100%; }
    .grid { grid-template-columns:1fr; }
    .kv { grid-template-columns:96px 1fr; }
    .toolbar .tabs { width:100%; }
    .tabs button { flex:1; }
  }
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div style="font-size:38px">🎬</div>
    <h1>Ars Fleet</h1>
    <div class="sub">Media orchestration dashboard</div>
    <div class="login-err" id="loginErr"></div>
    <form id="loginForm">
      <input type="text" id="loginUser" placeholder="Username" autocomplete="username" required>
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <h1>🎬 Ars Fleet <span class="v" id="verLabel"></span></h1>
    <div class="chips" id="chips"></div>
  </header>
  <div class="toolbar">
    <div class="tabs">
      <button id="tabDevices" class="active" onclick="switchTab('devices')">Devices</button>
      <button id="tabMedia" onclick="switchTab('media')">Media</button>
    </div>
    <select class="groupsel" id="groupFilter" onchange="renderDevices()">
      <option value="">All groups</option>
    </select>
    <div class="spacer"></div>
    <button class="icon-btn" onclick="refreshAll(true)">↻ Refresh</button>
    <button class="icon-btn" onclick="logout()">Logout</button>
  </div>

  <div id="devicesView" class="grid"></div>

  <div id="mediaView" style="display:none">
    <div class="dropzone" id="dropzone">
      <div style="font-size:26px;margin-bottom:8px">⬆</div>
      <b>Drop media files here</b> or tap to choose<br>
      <span style="font-size:12px">Videos (.mp4 .mkv .mov .webm) and images (.jpg .png) — multiple files at once</span>
      <input type="file" id="fileInput" multiple hidden
             accept="video/*,image/*,.mp4,.mkv,.mov,.webm,.m4v,.jpg,.jpeg,.png,.gif,.webp">
    </div>
    <div id="uploads"></div>
    <div style="overflow-x:auto">
      <table class="media-table">
        <thead><tr><th>File</th><th>Size</th><th>Assigned</th><th></th></tr></thead>
        <tbody id="mediaRows"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Device drawer -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<!-- Assign modal -->
<div class="modal" id="assignModal">
  <div class="modal-card">
    <h2 id="assignTitle">Assign to devices</h2>
    <div class="modal-body" id="assignBody"></div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeAssign()">Cancel</button>
      <button class="btn-primary" id="assignConfirm">Assign</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
'use strict';
const API = location.origin;
let token = localStorage.getItem('fleet_token') || '';
let devices = [], media = [], summary = null;
let currentTab = 'devices';
let drawerDevice = null;
let refreshTimer = null;

/* ── HTTP helpers ── */
async function api(path, opts = {}) {
  const headers = { 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) };
  const res = await fetch(`${API}${path}`, { ...opts, headers });
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { msg = (await res.json()).detail || msg; } catch(e) {}
    throw new Error(msg);
  }
  return res.json();
}
const form = (obj) => ({
  method: 'POST',
  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
  body: new URLSearchParams(obj).toString(),
});

/* ── Auth ── */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  try {
    const res = await fetch(`${API}/auth/token`, {
      method: 'POST', headers: { 'Authorization': 'Basic ' + btoa(`${user}:${pass}`) },
    });
    if (!res.ok) throw new Error('Wrong username or password');
    const data = await res.json();
    token = data.token; localStorage.setItem('fleet_token', token);
    showApp();
  } catch (err) {
    document.getElementById('loginErr').textContent = err.message;
  }
});
function logout() { token = ''; localStorage.removeItem('fleet_token'); showLogin(); }
function showLogin() {
  clearInterval(refreshTimer);
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
function showApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  refreshAll(true);
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => { if (!document.hidden) refreshAll(false); }, 10000);
}

/* ── Data ── */
async function refreshAll(showErrors) {
  try {
    const [d, s] = await Promise.all([api('/admin/devices'), api('/admin/summary')]);
    devices = d.devices || []; summary = s;
    if (currentTab === 'media' || media.length === 0) {
      const m = await api('/media/list'); media = m.files || [];
    }
    renderChips(); renderGroupFilter(); renderDevices(); renderMedia();
    if (drawerDevice) {
      const upd = devices.find(x => x.id === drawerDevice.id);
      if (upd) { upd._assignments = drawerDevice._assignments; drawerDevice = upd; renderDrawer(false); }
    }
  } catch (e) {
    if (showErrors && e.message !== 'unauthorized') toast('Load failed: ' + e.message, true);
  }
}
const isOnline = (dev) => dev.last_seen && (Date.now() - Date.parse(dev.last_seen)) < 90000;
const parseSettings = (dev) => { try { return JSON.parse(dev.settings || '{}'); } catch(e) { return {}; } };

/* ── Header chips ── */
function renderChips() {
  if (!summary) return;
  document.getElementById('chips').innerHTML = `
    <span class="chip c-on"><b>${summary.devices_online}</b> online</span>
    <span class="chip c-off"><b>${summary.devices_offline}</b> offline</span>
    <span class="chip c-pin"><b>${summary.devices_pinned}</b> pinned</span>
    <span class="chip"><b>${summary.media_files}</b> files · ${fmtSize(summary.media_bytes)}</span>`;
}
function renderGroupFilter() {
  const sel = document.getElementById('groupFilter');
  const cur = sel.value;
  const groups = summary ? summary.groups : [];
  sel.innerHTML = '<option value="">All groups</option>' +
    groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  sel.value = cur;
}

/* ── Devices ── */
function renderDevices() {
  const g = document.getElementById('groupFilter').value;
  const list = g ? devices.filter(d => d.group_name === g) : devices;
  const el = document.getElementById('devicesView');
  if (!list.length) {
    el.innerHTML = `<div class="empty-hint">No devices${g ? ' in this group' : ' registered yet'}.<br>
      A Pi appears here automatically once it boots with network access to this server.</div>`;
    return;
  }
  el.innerHTML = list.map(d => {
    const on = isOnline(d);
    const s = parseSettings(d);
    const pinIcon = d.pinned ? (d.pinned_source === 'sdcard' ? '💾' : '🔌') : '';
    return `<div class="dev" onclick="openDrawer('${esc(d.id)}')">
      <div class="dev-head">
        <span class="dot ${on ? 'on' : 'off'}"></span>
        <span class="dev-name">${esc(d.label || d.hostname || d.id)}</span>
        ${d.pinned ? `<span class="badge pin">${pinIcon} pinned</span>` : ''}
        ${d.fleet_state ? `<span class="badge state-${esc(d.fleet_state)}">${esc(stateLabel(d.fleet_state))}</span>` : ''}
      </div>
      <div class="dev-sub">${esc(d.id)} · ${esc(d.group_name || 'default')}${d.location ? ' · ' + esc(d.location) : ''}</div>
      <div class="dev-meta">
        <span>rot <b>${s.rotation ?? 0}°</b></span>
        <span>slide <b>${s.image_duration_s ?? '–'}s</b></span>
        <span>vol <b>${s.muted ? '🔇' : (s.volume_pct ?? '–') + '%'}</b></span>
        <span>${on ? 'seen <b>now</b>' : 'seen <b>' + ago(d.last_seen) + '</b>'}</span>
      </div>
    </div>`;
  }).join('');
}
const stateLabel = (s) => ({PLAYING_CONNECTED:'playing', PLAYING_OFFLINE:'offline·playing', NO_MEDIA:'no media'}[s] || String(s).toLowerCase());

/* ── Device drawer ── */
async function openDrawer(id) {
  drawerDevice = devices.find(d => d.id === id);
  if (!drawerDevice) return;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  renderDrawer(true);
  try {
    const a = await api(`/admin/devices/${id}/assignments`);
    drawerDevice._assignments = a.assignments || [];
    renderDrawer(false);
  } catch(e) {}
}
function closeDrawer() {
  drawerDevice = null;
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
let pendingDur = null, durTimer = null;
function renderDrawer(resetPending) {
  const d = drawerDevice;
  if (!d) return;
  if (resetPending) { pendingDur = null; clearTimeout(durTimer); }
  const s = parseSettings(d);
  const on = isOnline(d);
  const asg = d._assignments !== undefined ? d._assignments : null;
  document.getElementById('drawer').innerHTML = `
    <h2><span class="dot ${on ? 'on' : 'off'}"></span> ${esc(d.label || d.hostname || d.id)}
      <button class="close" onclick="closeDrawer()">×</button></h2>

    ${d.pinned ? `<div class="section" style="border-color:rgba(178,141,255,.45);background:rgba(178,141,255,.07)">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:20px">${d.pinned_source === 'sdcard' ? '💾' : '🔌'}</span>
        <div style="flex:1">
          <b>Pinned to ${d.pinned_source === 'sdcard' ? 'SD card' : 'USB'} media</b>
          <div style="font-size:11px;color:var(--dim)">Ignores server assignments until released.</div>
        </div>
        <button class="btn-ghost" onclick="releasePin('${esc(d.id)}')">Release</button>
      </div></div>` : ''}

    <div class="section">
      <h3>Info</h3>
      <div class="kv">
        <span class="k">Device ID</span><span class="v">${esc(d.id)}</span>
        <span class="k">Hostname</span><span class="v">${esc(d.hostname || '—')}</span>
        <span class="k">IP</span><span class="v">${esc(d.ip_address || '—')}</span>
        <span class="k">Model</span><span class="v">${esc((d.hw_model || '—').replace('Raspberry Pi','RPi'))}</span>
        <span class="k">State</span><span class="v">${esc(d.fleet_state || '—')}</span>
        <span class="k">Version</span><span class="v">${esc((d.current_manifest_version || '—').slice(0,24))}</span>
        <span class="k">Last seen</span><span class="v">${on ? 'online now' : ago(d.last_seen) + ' ago'}</span>
      </div>
    </div>

    <div class="section">
      <h3>Name & venue</h3>
      <div class="field-inline"><input id="editLabel" placeholder="Label (e.g. OK Linz — left screen)" value="${esc(d.label || '')}"></div>
      <div class="field-inline">
        <input id="editGroup" placeholder="Group" value="${esc(d.group_name || '')}">
        <input id="editLocation" placeholder="Venue / location" value="${esc(d.location || '')}">
      </div>
      <button class="btn-ghost" onclick="saveDeviceMeta('${esc(d.id)}')">Save</button>
    </div>

    <div class="section">
      <h3>Playback settings ${on ? '' : '<span style="color:var(--warn)">(offline — applies when back)</span>'}</h3>
      <div style="font-size:12px;color:var(--dim);margin-bottom:8px">Screen rotation</div>
      <div class="seg">
        ${[0,90,180,270].map(r => `<button class="${(s.rotation ?? 0) === r ? 'active' : ''}"
          onclick="pushSettings('${esc(d.id)}',{rotation:${r}})">${r}°</button>`).join('')}
      </div>
      <div style="font-size:12px;color:var(--dim);margin:14px 0 8px">Slide duration (images)</div>
      <div class="stepper">
        <button onclick="stepDur('${esc(d.id)}',-5)">−5</button>
        <button onclick="stepDur('${esc(d.id)}',-1)">−</button>
        <div class="val"><span id="durShow">${pendingDur ?? (s.image_duration_s ?? 10)}</span><small> sec</small></div>
        <button onclick="stepDur('${esc(d.id)}',1)">+</button>
        <button onclick="stepDur('${esc(d.id)}',5)">+5</button>
      </div>
      <div style="font-size:12px;color:var(--dim);margin:14px 0 8px">Volume</div>
      <div class="stepper">
        <button onclick="pushSettings('${esc(d.id)}',{volume_pct:${Math.max(0,(s.volume_pct ?? 100)-10)}})">−10</button>
        <div class="val"><span>${s.muted ? '🔇' : (s.volume_pct ?? 100) + '%'}</span></div>
        <button onclick="pushSettings('${esc(d.id)}',{volume_pct:${Math.min(200,(s.volume_pct ?? 100)+10)}})">+10</button>
        <button style="width:auto;padding:0 14px;font-size:13px" onclick="pushSettings('${esc(d.id)}',{muted:${s.muted ? 'false' : 'true'}})">${s.muted ? 'Unmute' : 'Mute'}</button>
      </div>
      <div class="settings-note">Values shown are what the device last reported. Changes apply live
        (no playback restart) and the card updates on the next heartbeat (~30s).</div>
    </div>

    <div class="section">
      <h3>Assigned media ${asg ? `(${asg.length})` : ''}</h3>
      ${asg === null ? '<div style="color:var(--dim);font-size:13px">Loading…</div>' :
        (asg.length ? asg.map(m => `<div class="assigned-item">
            <span>${mediaIcon(m.original_name || m.filename)}</span>
            <span class="n">${esc(m.original_name || m.filename)}</span>
            <button class="link-btn danger" onclick="unassignOne('${esc(m.id)}','${esc(d.id)}')">remove</button>
          </div>`).join('')
        : '<div style="color:var(--dim);font-size:13px">Nothing assigned. The device shows its idle card (or pinned media).</div>')}
      <button class="btn-ghost" style="margin-top:10px" onclick="openAssignForDevice('${esc(d.id)}')">＋ Assign media…</button>
    </div>

    <div class="section">
      <h3>Actions</h3>
      <div class="row-btns">
        <button class="btn-ghost" onclick="cmd('${esc(d.id)}','identify')">◉ Identify (30s)</button>
        <button class="btn-ghost" onclick="cmd('${esc(d.id)}','player_restart')">▶ Restart player</button>
        <button class="btn-ghost" onclick="cmd('${esc(d.id)}','update_now')">⬇ Sync now</button>
        <button class="btn-ghost" onclick="cmd('${esc(d.id)}','play_sd')">💾 Play from SD</button>
        <button class="btn-ghost danger" style="grid-column:1/-1" onclick="if(confirm('Reboot ${esc(d.label || d.id)}?'))cmd('${esc(d.id)}','reboot')">⟳ Reboot device</button>
      </div>
    </div>`;
}
async function saveDeviceMeta(id) {
  try {
    await api(`/admin/devices/${id}`, { ...form({
      label: document.getElementById('editLabel').value,
      group_name: document.getElementById('editGroup').value,
      location: document.getElementById('editLocation').value,
    }), method: 'PUT' });
    toast('Saved'); refreshAll(false);
  } catch (e) { toast('Save failed: ' + e.message, true); }
}
async function pushSettings(id, patch) {
  try {
    const body = {};
    for (const [k, v] of Object.entries(patch)) body[k] = String(v);
    await api(`/admin/devices/${id}/settings`, { ...form(body), method: 'PUT' });
    toast('Settings queued — applies within ~30s');
    const dev = devices.find(d => d.id === id);
    if (dev) { const s = parseSettings(dev); Object.assign(s, patch); dev.settings = JSON.stringify(s); }
    if (drawerDevice && drawerDevice.id === id) renderDrawer(true);
    renderDevices();
  } catch (e) { toast('Failed: ' + e.message, true); }
}
function stepDur(id, delta) {
  const dev = devices.find(d => d.id === id);
  const cur = pendingDur ?? (parseSettings(dev).image_duration_s ?? 10);
  pendingDur = Math.max(1, Math.min(3600, cur + delta));
  const el = document.getElementById('durShow');
  if (el) el.textContent = pendingDur;
  clearTimeout(durTimer);
  durTimer = setTimeout(() => { const v = pendingDur; pendingDur = null; pushSettings(id, {image_duration_s: v}); }, 700);
}
async function cmd(id, command) {
  try {
    await api(`/admin/devices/${id}/command`, form({ command, params: '{}' }));
    toast(`${command} queued — runs on next heartbeat (≤30s)`);
  } catch (e) { toast('Failed: ' + e.message, true); }
}
async function releasePin(id) {
  try {
    await api(`/admin/devices/${id}/unpin`, { method: 'POST' });
    toast('Pin released — device returns to server media');
    refreshAll(false);
  } catch (e) { toast('Failed: ' + e.message, true); }
}
async function unassignOne(mediaId, deviceId) {
  try {
    await api(`/media/${mediaId}/unassign`, form({ device_ids: deviceId }));
    toast('Removed');
    const a = await api(`/admin/devices/${deviceId}/assignments`);
    if (drawerDevice) { drawerDevice._assignments = a.assignments || []; renderDrawer(false); }
  } catch (e) { toast('Failed: ' + e.message, true); }
}

/* ── Media ── */
function renderMedia() {
  const rows = document.getElementById('mediaRows');
  if (!media.length) {
    rows.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--dim);padding:30px">No media uploaded yet</td></tr>';
    return;
  }
  rows.innerHTML = media.map(m => `<tr>
    <td class="media-name">${mediaIcon(m.original_name || m.filename)} ${esc(m.original_name || m.filename)}</td>
    <td>${fmtSize(m.size_bytes)}</td>
    <td id="asg-${esc(m.id)}">…</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="link-btn" onclick="openAssignForMedia('${esc(m.id)}')">assign</button>
      <button class="link-btn danger" onclick="deleteMedia('${esc(m.id)}','${esc((m.original_name||m.filename||'').replace(/'/g,''))}')">delete</button>
    </td>
  </tr>`).join('');
  media.forEach(async (m) => {
    try {
      const a = await api(`/media/${m.id}/assignments`);
      const el = document.getElementById(`asg-${m.id}`);
      if (el) el.textContent = (a.assignments || []).length + ' device(s)';
    } catch(e) {}
  });
}
async function deleteMedia(id, name) {
  if (!confirm(`Delete "${name}" from the server library?\nDevices keep already-downloaded copies until their next sync.`)) return;
  try {
    await api(`/media/${id}`, { method: 'DELETE' });
    toast('Deleted'); media = media.filter(m => m.id !== id); renderMedia();
  } catch (e) { toast('Failed: ' + e.message, true); }
}

/* Upload (multi-file with per-file progress) */
const dz = document.getElementById('dropzone');
const fi = document.getElementById('fileInput');
dz.addEventListener('click', () => fi.click());
dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('drag'); uploadFiles(e.dataTransfer.files); });
fi.addEventListener('change', () => { uploadFiles(fi.files); fi.value = ''; });

function uploadFiles(fileList) {
  [...fileList].forEach(f => uploadOne(f));
}
function uploadOne(file) {
  const wrap = document.getElementById('uploads');
  const row = document.createElement('div');
  row.className = 'upload-row';
  row.innerHTML = `<span style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(file.name)}</span>
    <div class="bar"><i></i></div><span class="pct" style="width:44px;text-align:right">0%</span>`;
  wrap.appendChild(row);
  const bar = row.querySelector('.bar i'), pct = row.querySelector('.pct');

  const fd = new FormData();
  fd.append('file', file);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', `${API}/media/upload`);
  xhr.setRequestHeader('Authorization', `Bearer ${token}`);
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const p = Math.round(e.loaded / e.total * 100);
      bar.style.width = p + '%'; pct.textContent = p + '%';
    }
  };
  xhr.onload = async () => {
    if (xhr.status >= 200 && xhr.status < 300) {
      bar.style.width = '100%'; pct.textContent = '✓';
      setTimeout(() => row.remove(), 1600);
      try { const m = await api('/media/list'); media = m.files || []; renderMedia(); } catch(e) {}
      toast(`Uploaded ${file.name}`);
    } else {
      pct.textContent = '✕'; row.style.borderColor = 'var(--bad)';
      toast(`Upload failed: ${file.name}`, true);
    }
  };
  xhr.onerror = () => { pct.textContent = '✕'; row.style.borderColor = 'var(--bad)'; toast(`Upload failed: ${file.name}`, true); };
  xhr.send(fd);
}

/* ── Assign modal ── */
let assignMediaIds = [];
function openAssignForMedia(mediaId) {
  assignMediaIds = [mediaId];
  const m = media.find(x => x.id === mediaId);
  document.getElementById('assignTitle').textContent = `Assign "${(m?.original_name || m?.filename || '').slice(0,40)}"`;
  buildAssignBody();
  document.getElementById('assignModal').classList.add('open');
}
function openAssignForDevice(deviceId) {
  const body = document.getElementById('assignBody');
  document.getElementById('assignTitle').textContent = 'Assign media to this device';
  body.innerHTML = media.length ? media.map(m => `
    <label class="pick"><input type="checkbox" value="${esc(m.id)}">
      <span>${mediaIcon(m.original_name || m.filename)} ${esc(m.original_name || m.filename)}</span>
      <span class="g">${fmtSize(m.size_bytes)}</span></label>`).join('')
    : '<div style="color:var(--dim);padding:20px;text-align:center">No media in the library yet — upload in the Media tab.</div>';
  document.getElementById('assignConfirm').onclick = async () => {
    const ids = [...body.querySelectorAll('input:checked')].map(i => i.value);
    if (!ids.length) return closeAssign();
    try {
      for (const mid of ids) await api(`/media/${mid}/assign`, form({ device_ids: deviceId }));
      toast(`${ids.length} file(s) assigned — device syncs within ~30s`);
      closeAssign();
      const a = await api(`/admin/devices/${deviceId}/assignments`);
      if (drawerDevice) { drawerDevice._assignments = a.assignments || []; renderDrawer(false); }
    } catch (e) { toast('Assign failed: ' + e.message, true); }
  };
  document.getElementById('assignModal').classList.add('open');
}
function buildAssignBody() {
  const body = document.getElementById('assignBody');
  const groups = {};
  devices.forEach(d => { (groups[d.group_name || 'default'] ||= []).push(d); });
  body.innerHTML = Object.entries(groups).map(([g, devs]) => `
    <div class="pick-group" data-group="${esc(g)}" onclick="toggleGroup(this)">▸ ${esc(g)} <span style="color:var(--dim)">(${devs.length}) — tap to select all</span></div>
    ${devs.map(d => `<label class="pick" data-group="${esc(g)}">
      <input type="checkbox" value="${esc(d.id)}">
      <span class="dot ${isOnline(d) ? 'on' : 'off'}" style="width:8px;height:8px"></span>
      <span>${esc(d.label || d.hostname || d.id)}</span>
      <span class="g">${esc(d.id.slice(-6))}</span>
    </label>`).join('')}`).join('');
  document.getElementById('assignConfirm').onclick = confirmAssign;
}
function toggleGroup(el) {
  const g = el.dataset.group;
  const boxes = [...document.querySelectorAll(`#assignBody label.pick`)]
    .filter(l => l.dataset.group === g).map(l => l.querySelector('input'));
  const anyOff = boxes.some(b => !b.checked);
  boxes.forEach(b => b.checked = anyOff);
}
async function confirmAssign() {
  const ids = [...document.querySelectorAll('#assignBody input:checked')].map(i => i.value);
  if (!ids.length) return closeAssign();
  try {
    for (const mid of assignMediaIds) {
      await api(`/media/${mid}/assign`, form({ device_ids: ids.join(',') }));
    }
    toast(`Assigned to ${ids.length} device(s) — they sync within ~30s`);
    closeAssign(); renderMedia();
  } catch (e) { toast('Assign failed: ' + e.message, true); }
}
function closeAssign() { document.getElementById('assignModal').classList.remove('open'); }

/* ── Tabs / misc ── */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabDevices').classList.toggle('active', tab === 'devices');
  document.getElementById('tabMedia').classList.toggle('active', tab === 'media');
  document.getElementById('devicesView').style.display = tab === 'devices' ? 'grid' : 'none';
  document.getElementById('mediaView').style.display = tab === 'media' ? 'block' : 'none';
  document.getElementById('groupFilter').style.display = tab === 'devices' ? 'block' : 'none';
  if (tab === 'media') api('/media/list').then(m => { media = m.files || []; renderMedia(); }).catch(()=>{});
}
function mediaIcon(name) {
  const ext = (name || '').split('.').pop().toLowerCase();
  if (['mp4','mkv','mov','webm','avi','m4v'].includes(ext)) return '🎥';
  if (['mp3','wav','flac','ogg','aac'].includes(ext)) return '🎵';
  return '🖼';
}
function fmtSize(b) {
  if (b == null) return '—';
  if (b > 1073741824) return (b/1073741824).toFixed(1) + ' GB';
  if (b > 1048576) return (b/1048576).toFixed(1) + ' MB';
  return Math.max(1, Math.round(b/1024)) + ' KB';
}
function ago(ts) {
  if (!ts) return 'never';
  const s = Math.floor((Date.now() - Date.parse(ts)) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ── Boot ── */
(async function boot() {
  if (!token) return showLogin();
  try {
    const h = await fetch(`${API}/health`).then(r => r.json()).catch(() => null);
    if (h) document.getElementById('verLabel').textContent = 'v' + (h.version || '');
    await api('/admin/summary');   // token check
    showApp();
  } catch (e) { showLogin(); }
})();
</script>
