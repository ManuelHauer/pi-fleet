# Ars Fleet — nginx config for the EDGE VPS (reverse proxy in front of the
# PowerEdge that runs the fleet server).
#
# Topology (per Emil, 2026-07-07):
#   Pis / admins ──HTTPS──▶ edge VPS (this nginx, TLS) ──▶ PowerEdge:8550 (fleet app)
#
# Fill in the two placeholders:
#   <FLEET_DOMAIN>    e.g. fleet.aec.at   (DNS A record → this VPS)
#   <POWEREDGE_IP>    the PowerEdge's IP reachable from the VPS
#
# TLS: terminate here however you usually do on this VPS (certbot/acme).
# The fleet app itself speaks plain HTTP on 8550 — restrict that port on the
# PowerEdge firewall to this VPS's IP.
#
# NOTE for the Pi side: NO tunnel/VPN/WireGuard is needed. The Pis only make
# OUTBOUND HTTPS requests to <FLEET_DOMAIN> (poll every 30 s + file downloads).
# The server never connects to the Pis.

upstream fleet_backend {
    server <POWEREDGE_IP>:8550;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name <FLEET_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <FLEET_DOMAIN>;

    # ssl_certificate     /etc/letsencrypt/live/<FLEET_DOMAIN>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<FLEET_DOMAIN>/privkey.pem;

    # Festival videos can be multi-GB uploads from the dashboard
    client_max_body_size 8g;

    # Stream uploads straight through instead of buffering them on the VPS disk
    proxy_request_buffering off;

    # Large media downloads to ~150 Pis — don't buffer to disk either
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    proxy_connect_timeout 30s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        proxy_pass http://fleet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Cheap uptime endpoint (also fine to hook monitoring into)
    location = /health {
        proxy_pass http://fleet_backend;
        access_log off;
    }
}
